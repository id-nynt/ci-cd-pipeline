name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download your code
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Ensure bash is available
      - name: Set up Bash
        run: |
          apt-get update
          apt-get install -y bash

      # Step 3: Initialize state and deployment folders
      - name: Initialize state and deployments
        run: |
          mkdir -p state deployments/staging deployments/production
          echo "v1" > state/production_version.txt
          echo "v1" > state/previous_production_version.txt
          echo "Initialized state files"

      # Step 4: Make scripts executable
      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      # Step 5: Build v2
      - name: Build v2
        run: ./scripts/build.sh v2

      # Step 6: Test v2
      - name: Test v2
        run: ./scripts/run-tests.sh v2

      # Step 7: Security scan v2
      - name: Security scan v2
        run: ./scripts/security-scan.sh v2

      # Step 8: Deploy to staging
      - name: Deploy to staging
        run: ./scripts/deploy.sh staging v2

      # Step 9: Check staging health
      - name: Check staging health
        run: ./scripts/health-check.sh staging

      # Step 10: Deploy to production
      - name: Deploy to production
        run: ./scripts/deploy.sh production v2

      # Step 11: Inject production failure (simulate)
      - name: Inject production failure
        run: touch state/force_production_health_failure

      # Step 12: Check production health (will fail)
      - name: Check production health
        run: ./scripts/health-check.sh production
        continue-on-error: true # Don't stop workflow even if this fails

      # Step 13: Rollback production
      - name: Rollback production
        run: ./scripts/rollback.sh production

      # Step 14: Verify recovery
      - name: Verify recovery
        run: |
          PROD_VERSION=$(cat state/production_version.txt)
          echo "Production version after rollback: $PROD_VERSION"
          if [ "$PROD_VERSION" = "v1" ]; then
            echo "RECOVERY SUCCESSFUL: Production restored to v1"
            exit 0
          else
            echo "RECOVERY FAILED: Production is $PROD_VERSION (expected v1)"
            exit 1
          fi
